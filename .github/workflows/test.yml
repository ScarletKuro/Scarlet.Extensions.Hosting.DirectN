name: test

on:
  workflow_call:

jobs:
  test:
    name: Test (JIT and Native AOT)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Scarlet.Extensions.Hosting.DirectN.slnx

      # TreatWarningsAsErrors + IsAotCompatible: any trim/AOT analyzer warning fails the build.
      - name: Build
        run: dotnet build Scarlet.Extensions.Hosting.DirectN.slnx -c Release --no-restore

      # Microsoft Code Coverage also collects from child processes, so the ScenarioApp runs count. GC reachability tests
      # (GC=true) are skipped here because instrumentation keeps objects alive; they run on Native AOT below.
      - name: Test
        run: >
          dotnet test --solution Scarlet.Extensions.Hosting.DirectN.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --results-directory ./TestResults
          --filter-not-trait "GC=true"

      # Microsoft Code Coverage writes one Cobertura report per test app, named with a bare GUID. Each is renamed to contain
      # "coverage" because the Codecov CLI discovers reports by filename pattern and does not recognise "*.cobertura.xml".
      - name: Collect coverage reports
        if: always()
        shell: bash
        run: |
          mkdir -p coverage
          i=0
          for f in TestResults/*.cobertura.xml; do
            [ -e "$f" ] || continue
            i=$((i + 1))
            cp "$f" "coverage/coverage-$i.cobertura.xml"
          done
          ls -l coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # xunit.v3.aot test projects, published as native executables.
      - name: Test libraries on Native AOT
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in 'Scarlet.DirectN.Threading.Tests', 'Scarlet.Extensions.Hosting.DirectN.Threading.Tests', 'Scarlet.Extensions.Hosting.DirectN.TrayIcon.Tests') {
            dotnet publish "tests/$project" -c Release -r win-x64 -o "artifacts/aot/$project" -p:PublishAot=true -p:TreatWarningsAsErrors=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "artifacts/aot/$project/$project.exe"
            if ($LASTEXITCODE -ne 0) { $failed += $project }
          }
          if ($failed) { Write-Error "Native AOT tests failed: $($failed -join ', ')"; exit 1 }

      # The ScenarioApp drives a real host, DirectN application, tray icon and JoinableTaskFactory; publishing it with
      # PublishAot proves the whole stack compiles to native code without IL/AOT warnings, then the same scenarios run on it.
      - name: Publish ScenarioApp (Native AOT)
        run: dotnet publish tests/Scarlet.Extensions.Hosting.DirectN.ScenarioApp -c Release -r win-x64 -o artifacts/aot/scenario -p:TreatWarningsAsErrors=true

      - name: Test scenarios on Native AOT
        shell: pwsh
        run: |
          $env:SCARLET_SCENARIO_APP = "$PWD/artifacts/aot/scenario/Scarlet.Extensions.Hosting.DirectN.ScenarioApp.exe"
          dotnet test --project tests/Scarlet.Extensions.Hosting.DirectN.Tests -c Release --no-build --filter-class "*.ScenarioTests"

      - name: Publish samples (Native AOT)
        run: |
          dotnet publish samples/HostingMinimal -c Release -r win-x64 -o artifacts/aot/HostingMinimal -p:TreatWarningsAsErrors=true
          dotnet publish samples/HostingTrayIcon -c Release -r win-x64 -o artifacts/aot/HostingTrayIcon -p:TreatWarningsAsErrors=true
